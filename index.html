<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Calculator</title>
    <link rel="icon" type="image/svg+xml" href="./assets/money-bills-solid-full (1).svg">
    <!-- Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <!-- FontAwsome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Bootstrap link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.1/css/bootstrap.min.css" integrity="sha512-Ez0cGzNzHR1tYAv56860NLspgUGuQw16GiOOp/I2LuTmpSK9xDXlgJz3XN4cnpXWDmkNBKXR/VDMTCnAaEooxA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- CSS link -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="container mt-4">
            <div class="row text-center justify-content-center">
                <div class="col-lg-8" id="heading">
                    <h2 class="mb-2 fw-bold">EXPENSE CALCULATOR</h2>
                    <p class="fs-6">Manage your monthly budget with ease</p>
                    <div class="line"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="mt-4">
        <div class="container-two">
            <div class="row justify-content-center ">
                <div class="col-lg-8 col-md-8 col-sm-8 col-11">
                    <div class="first d-flex justify-content-between align-items-center rounded">
                        <p>Enter Your Total Balance</p> 
                        <div class="d-flex flex-column ">
                            <div>    
                                <input type="text" class="original-amount rounded" value="" placeholder="0 đ"/>
                                <button type="button" class="btn circle-button" id="first-circle" aria-label="Confirm total balance" data-confirm-label="Confirm total balance" data-edit-label="Edit total balance">
                                    <i class="fa-regular fa-circle" aria-hidden="true"></i>
                                </button>
                            </div>
                            <small class="warning-text text-danger"></small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row justify-content-center rounded-3 mt-4 pt-3 pb-3 second">
                <div class="col-lg-4 col-md-4 col-sm-6 col-6 category">
                    <section class="need">
                        <h4 class="mb-1">Needs <span>(50%)</span></h4>
                        <p class="amount mb-2">0 đ</p>
                        <div class="fDiv rounded-3 p-2">
                            <p class="text-start mb-2 fw-bold">Spent</p>
                            <div class="expense-list">
                                <div class="input-box">
                                    <input type="text" value="" placeholder="0 đ" class="rounded-3 outline-0 fs-5 spent-amount" /> 
                                    <button type="button" class="btn circle-button" aria-label="Confirm expense" data-confirm-label="Confirm expense" data-edit-label="Edit expense">
                                        <i class="fa-regular fa-circle" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="add-expense-button">
                                + Add Expense
                            </button>
                        </div>
                        <div class="sDiv rounded-3 mt-3 p-2 pb-3">
                            <p class="text-start mb-2 fw-bold">Remaining</p>
                            <input type="text" value="" placeholder="0 đ" class="rounded-3 outline-0 fs-5 remaining-amount" disabled/>
                        </div>
                    </section>
                </div>

                <div class="col-lg-4 col-md-4 col-sm-6 col-6 category">
                    <section class="want">
                        <h4 class="mb-1">Wants <span>(30%)</span></h4>
                        <p class="amount mb-2">0 đ</p>
                        <div class="fDiv rounded-3 p-2">
                            <p class="text-start mb-2 fw-bold">Spent</p>
                            <div class="expense-list">
                                <div class="input-box"> 
                                    <input type="text" value="" placeholder="0 đ" class="rounded-3 outline-0 fs-5 spent-amount" />
                                    <button type="button" class="btn circle-button" aria-label="Confirm expense" data-confirm-label="Confirm expense" data-edit-label="Edit expense">
                                        <i class="fa-regular fa-circle" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="add-expense-button">
                                + Add Expense
                            </button>
                        </div>
                        <div class="sDiv rounded-3 mt-3 p-2 pb-3">
                            <p class="text-start mb-2 fw-bold">Remaining</p>
                            <input type="text" value="" placeholder="0 đ" class="rounded-3  outline-0 fs-5 remaining-amount" disabled/>
                        </div>
                    </section>
                </div>

                <div class="col-lg-4 col-md-4 col-sm-12 category">
                    <section class="save">
                        <h4 class="mb-1">Savings <span>(20%)</span></h4>
                        <p class="amount mb-2">0 đ</p>
                        <div class="fDiv rounded-3 p-2">
                            <p class="text-start mb-2 fw-bold">Spent</p>
                            <div class="expense-list">
                                <div class="input-box">
                                    <input type="text" value="" placeholder="0 đ" class="rounded-3 outline-0 fs-5 spent-amount" />
                                    <button type="button" class="btn circle-button" aria-label="Confirm expense" data-confirm-label="Confirm expense" data-edit-label="Edit expense">
                                        <i class="fa-regular fa-circle" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="add-expense-button">
                                + Add Expense
                            </button>
                        </div>
                        <div class="sDiv rounded-3 mt-3 p-2 pb-3">
                            <p class="text-start mb-2 fw-bold">Remaining</p>
                            <input type="text" value="" placeholder="0 đ" class="rounded-3  outline-0 fs-5 remaining-amount" disabled/>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-3 main-footer">
        <div class="container-three">
             <div class="row justify-content-center">
                <div class="col-lg-8 col-md-8 col-sm-8 col-11 fw-bold">
                    <div class="footer">
                        <div class="d-flex justify-content-between align-items-center fs-5 mb-2">
                            <p class="fs-6 m-0">Total Spent</p>
                            <p class="fs-4 m-0 total-spent">0 đ</p>
                        </div>
                        <div class="line"></div>
                        <div class="d-flex justify-content-between align-items-center fs-5 mt-2">
                            <p class="fs-6 m-0">Total Remaining</p>
                            <p class="fs-4 m-0 total-remaining">0 đ</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
</body>
</html>
